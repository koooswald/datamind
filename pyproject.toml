[project]
name = "datamind"
version = "0.1.0"
description = "Multi-agent data intelligence system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "anthropic>=0.28.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "chromadb>=0.5.0",
    "duckdb>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
